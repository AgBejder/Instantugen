<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/generel.css" />

    <header class="site-header">
      <div class="logo"><img src="/billeder/logo.png" alt="logo" /></div>

      <button
        class="burger"
        id="burgerBtn"
        aria-label="Åbn menu"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mainNav">
        <a href="/inspiration.html">Vinder & Inspiration</a>
        <a href="/index.html">Hvad og hvorfor?</a>
        <a href="/index.html">Hvem er vi?</a>
        <a href="/deltag.html" class="cta">Deltag her</a>
      </nav>
    </header>
    <main></main>
    <footer class="site-footer">
      <div class="logo">
        <img src="/billeder/logo.png" alt="logo" />
        <small><img src="/billeder/eklogo.png" alt="eklogo" /></small>

      <div class="follow">

        <div class="social-icons">
          <a href="#" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor">

                d="M13.5 21v-7.5h2.5l.4-3H13.5V8.5c0-.9.25-1.5 1.55-1.5H16.5V4.35C16.2 4.3 15.2 4.2 14 4.2c-2.4 0-4 1.45-4 4.15V10.5H7.5v3H10V21h3.5z"
              />
            </svg>
          </a>

              <path

              stroke="currentColor"

              <circle cx="17.3" cy="6.7" r="1" />
            </svg>
          </a>
        </div>
      </div>

      <div class="legal-links">
        <a href="#">Love og regler</a>
        <a href="#">Kontakt</a>
        <a href="#">Deltag</a>
      </div>
    </footer>
    <script>
      const burgerBtn = document.getElementById("burgerBtn");
      const mainNav = document.getElementById("mainNav");

      burgerBtn.addEventListener("click", () => {
        const isOpen = mainNav.classList.toggle("open");
        burgerBtn.classList.toggle("open");
        burgerBtn.setAttribute("aria-expanded", isOpen);
      });
    </script>
  </body>
</html>
